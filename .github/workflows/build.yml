name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  # ==================== BUILD WINDOWS INSTALLER ====================
  build-windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up MSVC (needed to compile PyInstaller bootloader)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Rebuild PyInstaller bootloader from source
        shell: bash
        run: |
          git clone --depth 1 https://github.com/pyinstaller/pyinstaller.git _pyi_src
          cd _pyi_src/bootloader
          python waf all --target-arch=64bit
          cd ../..
          python - <<'EOF'
          import PyInstaller, os, shutil
          src = os.path.join("_pyi_src", "PyInstaller", "bootloader", "Windows-64bit-intel")
          dst = os.path.join(os.path.dirname(PyInstaller.__file__), "bootloader", "Windows-64bit-intel")
          os.makedirs(dst, exist_ok=True)
          for f in os.listdir(src):
              shutil.copy2(os.path.join(src, f), os.path.join(dst, f))
          print("Bootloader replaced:", os.listdir(dst))
          EOF

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION_CLEAN="${VERSION#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            VERSION_CLEAN="0.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_clean=$VERSION_CLEAN" >> $GITHUB_OUTPUT
          echo "Version: $VERSION  (clean: $VERSION_CLEAN)"

      - name: Write version.txt
        shell: bash
        run: |
          echo "version: ${{ steps.version.outputs.version }}" > version.txt
          cat version.txt

      - name: Build with PyInstaller (--onedir)
        run: pyinstaller ElliottsCasparController.spec

      - name: Verify PyInstaller output
        run: |
          $exePath = "dist\ElliottsCasparController\ElliottsCasparController.exe"
          if (Test-Path $exePath) {
            Write-Host "PyInstaller build OK: $exePath"
            Get-Item $exePath | Format-List Name, Length, LastWriteTime
          } else {
            Write-Error "Expected exe not found at $exePath"
            Get-ChildItem dist\ -Recurse | Format-Table FullName
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = "${{ steps.version.outputs.version_clean }}"
          & $iscc /DMyAppVersion="$version" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer
        run: |
          $setup = "installer\Output\ElliottsCasparControllerSetup.exe"
          if (Test-Path $setup) {
            Write-Host "Installer built OK"
            Get-Item $setup | Format-List Name, Length, LastWriteTime
          } else {
            Write-Error "Installer not found at $setup"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/ElliottsCasparControllerSetup.exe
          retention-days: 90

  # ==================== BUILD PYTHON PACKAGE ====================
  build-package:
    name: Build Python Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist & wheel
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload python package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          retention-days: 90

  # ==================== PUBLISH TO PYPI ====================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-package
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Publish to PyPI
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN not set - skipping PyPI publish"
            exit 0
          fi
          python -m twine upload dist/*

  # ==================== CREATE GITHUB RELEASE ====================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-installer, build-package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Carry forward LiteCasparServer.zip from latest release that has it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Search all recent releases (including pre-releases) for LiteCasparServer.zip
          FOUND=""
          TAGS=$(gh release list --repo ${{ github.repository }} --limit 50 \
            --json tagName,isPrerelease --jq '.[].tagName')
          for TAG in $TAGS; do
            if [ "$TAG" = "${{ github.ref_name }}" ]; then
              continue
            fi
            if gh release view "$TAG" --repo ${{ github.repository }} --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -q "^LiteCasparServer.zip$"; then
              echo "Found LiteCasparServer.zip in release $TAG — downloading..."
              gh release download "$TAG" --repo ${{ github.repository }} \
                --pattern "LiteCasparServer.zip" --dir artifacts/
              FOUND="$TAG"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "No release has LiteCasparServer.zip — it will be absent from this release"
          fi

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --abbrev=0 --tags ${{ github.ref_name }}^ 2>/dev/null || echo "")

          cat > release-notes.md << 'EOF'
          ## Elliott's Caspar Controller ${{ github.ref_name }}

          Desktop app and web UI for managing multiple CasparCG NDI outputs from a single Windows machine.

          ### Installation

          **New install or upgrade from v1.x:**
          1. Download `ElliottsCasparControllerSetup.exe` below and run it
          2. Follow the wizard — no admin rights required
          3. Launch from the desktop shortcut

          **Auto-update from v2.x:**
          The app will notify you and handle the update silently.

          ### Quick Start

          1. Run the installer and launch the app
          2. Go to **Open Web UI** (or `http://127.0.0.1:5280`)
          3. Go to **Settings** → set the path to `casparcg.exe`
          4. Add your output instances, click **Save & Regenerate Configs**, then **Start All**

          See the [README](https://github.com/BlueElliott/Elliotts-Caspar-Controller#readme) for full setup instructions.

          ### Changelog
          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "" >> release-notes.md
            echo "**Changes since $PREV_TAG:**" >> release-notes.md
            git log $PREV_TAG..${{ github.ref_name }} --pretty=format:"- %s (%h)" >> release-notes.md
          fi

          echo "" >> release-notes.md
          echo "" >> release-notes.md
          echo "---" >> release-notes.md
          echo "Issues: https://github.com/BlueElliott/Elliotts-Casper-Controller/issues" >> release-notes.md

          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-installer/ElliottsCasparControllerSetup.exe
            artifacts/LiteCasparServer.zip
          fail_on_unmatched_files: false
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
